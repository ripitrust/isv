# isv project configuration. Everything project-specific lives here; the skills stay generic.

[project]
docs_dir = "docs/designs"          # where briefs live (one file per change)
# test_globs = ["tests/**"]        # excluded from PR size metrics

[tiers]
t0_max_changed_lines = 100

[brief]
max_lines = 250

[review]
max_rounds = 3
max_nits = 5
# A reviewer from another model family, for frame's fidelity review and risk-path PRs. It gets the
# prompt on stdin and prints findings on stdout; keep it read-only. It runs as a plain command line
# (no shell) from the repository root, so review it like any project script. Unset: a
# fresh-context subagent of the current agent is used.
# external_cmd = "codex exec -s read-only --ephemeral -"                  # Claude Code as the author
# external_cmd = "claude -p --strict-mcp-config --tools Read,Grep,Glob"   # Codex as the author

# When authors use different tools: a reviewer per tool, picked by the author's <tool>
# (`isv review --author agent:<tool>/<model>`, else ISV_ACTOR). A tool not listed here uses
# external_cmd; an empty entry means none.
# [review.external_cmd_by_tool]
# codex = "claude -p --strict-mcp-config --tools Read,Grep,Glob"

[risk]
# Changes touching these paths need a human merge approval (verdict NEEDS-HUMAN).
paths = [
  # "migrations/**",
  # ".github/workflows/**",
]

[pr]
required_sections = ["Why", "What", "Verification", "Risk", "Surface budget"]

# Each detector finds new surface in ADDED lines; capture group 1 is the identifier.
# Every identifier found must be named in the PR body's "## Surface budget" section.
# [[surface.detectors]]
