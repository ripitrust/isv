[project]
name = "isv"
version = "0.1.7"
description = "Intent → Slice → Verify: a lean, tool-agnostic flow for agent-assisted software development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
isv = "isv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"isv/checks.py" = ["S603", "S607"]
"isv/cli.py" = ["S603"]
"isv/config.py" = ["S603", "S607"]
"isv/report.py" = ["S603", "S607"]
