[project]
name = "isv"
version = "0.2.4"
description = "Intent → Slice → Verify: a lean, tool-agnostic flow for agent-assisted software development"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ripitrust" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["sdlc", "workflow", "code-review", "coding-agents", "claude-code", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/ripitrust/isv"
Changelog = "https://github.com/ripitrust/isv/blob/main/CHANGELOG.md"
Issues = "https://github.com/ripitrust/isv/issues"

[project.scripts]
isv = "isv.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["isv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"isv/checks.py" = ["S603", "S607"]
"isv/cli.py" = ["S603"]
"isv/config.py" = ["S603", "S607"]
"isv/report.py" = ["S603", "S607"]
